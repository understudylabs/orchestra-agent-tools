name: Orchestra PR capture
on:
  workflow_dispatch:
    inputs:
      session:
        description: Session metadata supplied by orchestra claude-session register-pr
        required: false
        type: string
      pr:
        description: PR number to reconcile after registration or delayed GitHub checks
        required: false
        type: string
  pull_request_target:
    types: [opened, synchronize, reopened, closed]
permissions:
  contents: read
  actions: read
  pull-requests: read
  checks: read
jobs:
  capture:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      # Trusted default-branch code only. Never check out or execute the PR head.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - id: capture
        run: node .github/orchestra/capture.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event.inputs.session != '' && github.event.inputs.session != null
        with:
          name: orchestra-session-${{ steps.capture.outputs.session_id }}
          path: session.json
          retention-days: 90
          if-no-files-found: error
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: github.event.inputs.session == '' || github.event.inputs.session == null
        with:
          name: orchestra-pr-report-${{ github.run_id }}
          path: pr-report.json
          retention-days: 90
          if-no-files-found: error
